# fly.toml app configuration file for kcal
app = 'kcal'
primary_region = 'gru'
kill_signal = 'SIGTERM'

[build]

[env]
  DATABASE_PATH = '/data/kcal.db'
  PHX_HOST = 'kcal.fly.dev'
  PORT = '8080'

[mounts]
  source = 'kcal_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  cpu_kind = 'shared'
